<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PET has moved to PIE Tracker</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://bkar81.github.io/pie/">
<link rel="canonical" href="https://bkar81.github.io/pie/">
<script>
  // Send /pet/anything to the same page in /pie/ (keeps ?query and #hash).
  (function(){
    var path = location.pathname.replace(/^\/pet(\/|$)/i, "/pie/");
    if (path === location.pathname) path = "/pie/";
    location.replace(path + location.search + location.hash);
  })();
</script>

  body{margin:0;background:#0B0D10;color:#E8E6E1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;text-align:center}
  a{color:#D9A441}
</style>
</head>

</body>
</html>
